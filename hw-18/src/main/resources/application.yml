spring:
  messages:
    encoding: UTF-8
  datasource:
    url: jdbc:postgresql://localhost:5432/library
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    clean-on-validation-error: false
  data:
    rest:
      basePath: /datarest

management:
  endpoints:
    web:
      base-path: "/application-check"
      exposure:
        include: "flyway, health,metrics"
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
    shutdown:
      enabled: true
  health:
    defaults:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 100
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        permitted-number-of-calls-in-half-open-state: 10
        minimum-number-of-calls: 10
    instances:
      defaultCircuitBreaker:
        base-config: default
  ratelimiter:
    configs:
      default:
        timeout-duration: 100ms
        limit-refresh-period: 1s
        limit-for-period: 1000
    instances:
      defaultRateLimiter:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      defaultCircuitBreaker:
        base-config: default
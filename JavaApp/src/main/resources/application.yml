server:
  port: 8085
  servlet:
    context-path: /javaapp
spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: true
    use-code-as-default-message: false
  datasource:
    url: jdbc:postgresql://localhost:5432/java-learn
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    clean-on-validation-error: false

  mail:
    host: smtp.mail.ru
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
app:
  phone: +7(999)-999-99-99
  email: javaLearnSupport@mail.ru
  telegram: javaLearnSupport
  admin-email: ${ADMIN_EMAIL}
  mail-printform-path: mail/
  users-photo-url: /images/users/
  mail:
    username: ${MAIL_USERNAME}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
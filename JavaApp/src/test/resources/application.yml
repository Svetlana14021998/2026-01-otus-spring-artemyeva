spring:
  datasource:
    url: jdbc:h2:mem:javalearn;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  flyway:
    enabled: true
    locations: classpath:db/migration
    sql-migration-prefix: V
    repeatable-sql-migration-prefix:
    clean-on-validation-error: false
    log-level: DEBUG

app:
  phone: +7(999)-999-99-99
  email: javaLearnSupport@mail.ru
  telegram: javaLearnSupport
  admin-email: ${ADMIN_EMAIL}
  mail-printform-path: /mail/
  mail:
    username: ${MAIL_USERNAME}